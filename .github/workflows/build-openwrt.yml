name: Build OpenWrt

on:
  push:
    branches: [main]
    paths:
      - .config
      - feeds.conf.default
      - patches/**
      - scripts/**
      - .github/workflows/build-openwrt.yml
  workflow_dispatch:
    inputs:
      full_firmware:
        description: Also build complete firmware (requires separate deployment review)
        type: boolean
        default: false
  repository_dispatch:

permissions:
  contents: read

concurrency:
  group: openwrt-${{ github.ref }}
  cancel-in-progress: false

env:
  SOURCE_URL: https://github.com/hanwckf/immortalwrt-mt798x.git
  SOURCE_COMMIT: ba554197ed7e252fd3c1ee023621e1d1d009d323
  EXPECTED_KERNEL: 5.4.284-1-4c477d255c38d4ac64c5d98b9d3353e7
  EXPECTED_VERMAGIC: 5.4.284 SMP mod_unload aarch64
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout build configuration
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Free disk space for the legacy toolchain
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install build dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev libelf-dev \
            python3 python3-distutils python3-setuptools rsync swig unzip zlib1g-dev \
            file wget curl ca-certificates xz-utils zstd cpio time kmod
          df -h

      - name: Check out exact firmware source
        run: |
          mkdir openwrt diagnostics
          cd openwrt
          git init
          git remote add origin "$SOURCE_URL"
          git fetch --depth=1 origin "$SOURCE_COMMIT"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$SOURCE_COMMIT"

      - name: Restore source download cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: openwrt/dl
          key: mt7981-dl-${{ env.SOURCE_COMMIT }}-${{ hashFiles('.config', 'feeds.conf.default') }}
          restore-keys: mt7981-dl-${{ env.SOURCE_COMMIT }}-

      - name: Apply fix and original configuration
        run: bash scripts/prepare-build.sh

      - name: Download sources
        working-directory: openwrt
        run: make download -j8 2>&1 | tee ../diagnostics/download.log

      - name: Build host tools and cross compiler
        working-directory: openwrt
        run: |
          make tools/install -j"$(nproc)" 2>&1 | tee ../diagnostics/tools.log || \
            make tools/install -j1 V=s 2>&1 | tee -a ../diagnostics/tools.log
          make toolchain/install -j"$(nproc)" 2>&1 | tee ../diagnostics/toolchain.log || \
            make toolchain/install -j1 V=s 2>&1 | tee -a ../diagnostics/toolchain.log

      - name: Build kernel and patched Wi-Fi package
        working-directory: openwrt
        run: |
          make target/linux/compile -j"$(nproc)" 2>&1 | tee ../diagnostics/kernel.log || \
            make target/linux/compile -j1 V=s 2>&1 | tee -a ../diagnostics/kernel.log
          make package/mtk/drivers/mt_wifi/compile -j1 V=s 2>&1 | tee ../diagnostics/mt_wifi.log

      - name: Verify package compatibility and fixed receive path
        run: python3 scripts/verify-package.py

      - name: Upload compatible driver
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mt_wifi-fixed-konka-a31-${{ github.run_number }}
          path: artifacts/driver/
          if-no-files-found: error
          retention-days: 30

      - name: Build complete firmware when requested
        if: ${{ inputs.full_firmware == true }}
        working-directory: openwrt
        run: |
          make -j"$(nproc)" 2>&1 | tee ../diagnostics/firmware.log || \
            make -j1 V=s 2>&1 | tee -a ../diagnostics/firmware.log

      - name: Upload optional complete firmware
        if: ${{ success() && inputs.full_firmware == true }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firmware-konka-a31-${{ github.run_number }}
          path: |
            openwrt/bin/targets/mediatek/mt7981/*sysupgrade*
            openwrt/bin/targets/mediatek/mt7981/*manifest*
            openwrt/bin/targets/mediatek/mt7981/*buildinfo*
            openwrt/bin/targets/mediatek/mt7981/sha256sums
          if-no-files-found: error
          retention-days: 30

      - name: Save build diagnostics
        if: ${{ always() }}
        run: |
          mkdir -p diagnostics
          test ! -f openwrt/.config || cp openwrt/.config diagnostics/resolved.config
          find openwrt/build_dir -path '*/linux-5.4.284/.config' -exec cp '{}' diagnostics/built-kernel.config \; 2>/dev/null || true
          df -h > diagnostics/disk-usage.txt

      - name: Upload diagnostics
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-diagnostics-${{ github.run_number }}
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
